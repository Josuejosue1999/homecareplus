[build]
  command = "npm install && npm install serverless-http"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/test-config"
  to = "/.netlify/functions/test-config"
  status = 200

[[redirects]]
  from = "/test-simple"
  to = "/.netlify/functions/test-simple"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/.netlify/functions/api/"
  status = 200

[[redirects]]
  from = "/register"
  to = "/.netlify/functions/api/register"
  status = 200

[[redirects]]
  from = "/login"
  to = "/.netlify/functions/api/login"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/.netlify/functions/api/dashboard"
  status = 200

[[redirects]]
  from = "/selection"
  to = "/.netlify/functions/api/selection"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[functions]
  directory = "netlify/functions" 