<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeCare Plus - Test Déploiement</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .status {
            background: #28a745;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            font-weight: bold;
        }
        .actions {
            margin-top: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 0.5rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 HomeCare Plus</h1>
        <div class="status">
            ✅ Site déployé avec succès !
        </div>
        <p>Plateforme de gestion médicale professionnelle</p>
        <p><strong>Test de déploiement Netlify :</strong> <span id="timestamp"></span></p>
        
        <div class="actions">
            <a href="/.netlify/functions/hello" class="btn">🔧 Test Function</a>
            <a href="#" onclick="testAPI()" class="btn">📡 Test API</a>
            <a href="#" onclick="location.reload()" class="btn">🔄 Actualiser</a>
        </div>
        
        <div id="test-results" style="margin-top: 2rem; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px; display: none;">
            <h3>Résultats des tests :</h3>
            <div id="results-content"></div>
        </div>
    </div>

    <script>
        // Afficher l'heure
        document.getElementById('timestamp').textContent = new Date().toLocaleString('fr-FR');
        
        // Test API
        async function testAPI() {
            const results = document.getElementById('test-results');
            const content = document.getElementById('results-content');
            results.style.display = 'block';
            content.innerHTML = 'Test en cours...';
            
            try {
                const response = await fetch('/.netlify/functions/hello');
                const data = await response.json();
                content.innerHTML = `
                    <div style="color: #28a745;">✅ API Function OK</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                content.innerHTML = `
                    <div style="color: #dc3545;">❌ API Function Error</div>
                    <div>${error.message}</div>
                `;
            }
        }
    </script>
</body>
</html>
