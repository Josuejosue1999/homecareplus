# FIREBASE_PROJECT_ID = "homecare-9f4d0"
# FIREBASE_STORAGE_BUCKET = "homecare-9f4d0.appspot.com"
# FIREBASE_MESSAGING_SENDER_ID = "your-actual-sender-id"
# FIREBASE_APP_ID = "your-actual-app-id" 